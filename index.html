<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edu-gierki</title>
<link rel="stylesheet" href="wspolne.css">
<style>
.games { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; }
.game {
  display: flex; align-items: center; gap: 1rem; width: 100%;
  background: #fff; border-radius: 24px; padding: 1rem 1.2rem;
  border: 2px solid #ffe0b2; box-shadow: 0 4px 0 #ffe0b2;
  text-decoration: none; color: #444; transition: transform 0.1s, border-color 0.1s;
}
.game:hover { border-color: #ff9800; transform: translateY(-2px); }
.game:active { transform: scale(0.98); }
.game-icon {
  font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1; flex: none;
  width: clamp(56px, 16vw, 68px); height: clamp(56px, 16vw, 68px);
  display: flex; align-items: center; justify-content: center;
  border-radius: 18px;
}
.game-name { font-size: clamp(1.05rem, 4vw, 1.2rem); font-weight: 900; color: #333; }
.game-desc { font-size: clamp(0.8rem, 3vw, 0.9rem); color: #999; line-height: 1.35; margin-top: 0.15rem; }
.game-arrow { margin-left: auto; font-size: 1.3rem; font-weight: 900; color: #ffcc80; flex: none; }
.section-label { width: 100%; font-size: 0.8rem; font-weight: 900; color: #ffb74d; text-transform: uppercase; letter-spacing: 1px; margin: 0.4rem 0 -0.3rem 0.4rem; }
</style>
</head>
<body>
<div class="decos">
  <span class="deco" style="top:5%;left:3%;animation-delay:0s">⭐</span>
  <span class="deco" style="top:12%;left:88%;animation-delay:1s">🌈</span>
  <span class="deco" style="top:70%;left:5%;animation-delay:2s">🎈</span>
  <span class="deco" style="top:80%;left:90%;animation-delay:0.5s">🦋</span>
  <span class="deco" style="top:40%;left:92%;animation-delay:1.5s">📚</span>
  <span class="deco" style="top:55%;left:2%;animation-delay:2.5s">🌸</span>
</div>

<div id="app">
  <div class="screen active">
    <div class="title">🎮 Edu-gierki!</div>
    <div class="subtitle">Wybierz grę i ucz się przez zabawę!</div>
    <div class="games" id="games"></div>
  </div>
</div>

<script>
// Aby dodać nową grę, dopisz ją tutaj.
const GAMES = [
  { section: '🧮 Matematyka' },
  { href: 'matematyka.html', icon: '🧮', bg: '#ffebee', name: 'Matema-GRA',
    desc: 'Mnożenie i dzielenie do 50' },
  { section: '🇬🇧 Angielski' },
  { href: 'miesiace-quiz.html', icon: '📅', bg: '#e3f2fd', name: 'Kalendarz-QUIZ',
    desc: 'Miesiące i pory roku — wybierz 1 z 4 odpowiedzi' },
  { href: 'miesiace-litery.html', icon: '✏️', bg: '#e8f5e9', name: 'Literkowo',
    desc: 'Miesiące i pory roku — uzupełnij brakujące litery' },
];

const list = document.getElementById('games');
GAMES.forEach(g => {
  if (g.section) {
    const s = document.createElement('div');
    s.className = 'section-label';
    s.textContent = g.section;
    list.appendChild(s);
    return;
  }
  const a = document.createElement('a');
  a.className = 'game';
  a.href = g.href;
  a.innerHTML = `<div class="game-icon"></div><div><div class="game-name"></div><div class="game-desc"></div></div><div class="game-arrow">›</div>`;
  a.querySelector('.game-icon').textContent = g.icon;
  a.querySelector('.game-icon').style.background = g.bg;
  a.querySelector('.game-name').textContent = g.name;
  a.querySelector('.game-desc').textContent = g.desc;
  list.appendChild(a);
});
</script>
</body>
</html>
